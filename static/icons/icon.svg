<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <radialGradient id="bg" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#ffe4c4"/>
            <stop offset="100%" stop-color="#ff9b6a"/>
        </radialGradient>
    </defs>
    <!-- 背景圆 -->
    <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
    <!-- 猫咪 emoji 简化（兜底，PNG 加载失败时显示） -->
    <text x="256" y="340" font-size="280" text-anchor="middle" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🐱</text>
    <!-- 外圈描边 -->
    <circle cx="256" cy="256" r="252" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.5"/>
</svg>